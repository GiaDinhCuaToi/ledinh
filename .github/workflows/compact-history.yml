name: Gộp lịch sử cũ của kho dữ liệu

# Kho này vừa là trang web tĩnh vừa là "cơ sở dữ liệu": mỗi lần trang lưu dữ liệu là 1 commit chứa
# nguyên 1 bản data/vault.enc.json mới (đã mã hóa → git không nén gọn được). Không dọn thì LỊCH SỬ
# lớn dần mãi (cỡ 0,5–1 GB mỗi năm) tới lúc GitHub nhắc/chặn vì kho quá lớn, dù các file đang dùng chỉ
# vài chục MB. Workflow này chạy mỗi tuần: gộp mọi thứ cũ hơn 30 lần ghi gần nhất thành 1 commit, giữ
# nguyên 30 lần ghi gần nhất (để còn khôi phục bản cũ gần đây). Nội dung file hiện tại không đổi 1
# byte, và không bao giờ đè mất lần ghi nào của trang — chi tiết trong scripts/compact-history.sh.
#
# Lưu ý: sau khi gộp, GitHub tự dọn các bản cũ không còn dùng theo lịch riêng của họ (có thể vài ngày
# tới vài tuần) — dung lượng kho hiển thị trên GitHub giảm dần chứ không tụt ngay.
#
# VÌ SAO KHÔNG CHẠY THEO LỊCH (cron) NỮA: ở kho công khai, GitHub TỰ TẮT hẳn workflow có lịch chạy
# nếu kho không có hoạt động nào trong 60 ngày, và không tự bật lại — phải có người vào bật bằng
# tay. Một trang gia phả có thể vắng vài tháng liền, sau đó lịch sử lại phình mãi mà không ai biết.
# Thay vào đó: chạy sau MỖI lần có dữ liệu mới đẩy lên (lịch sử chỉ lớn lên khi có lần ghi, nên
# kiểm tra đúng lúc đó là đủ). Mỗi lần chạy chỉ đếm số lần ghi (vài giây); chỉ khi đã quá
# MIN_COMMITS lần ghi mới thật sự gộp, còn lại thoát ngay. Lần đẩy do chính workflow này thực hiện
# (bằng GITHUB_TOKEN) không kích hoạt lại workflow → không lặp vô hạn.
#
# File này (và scripts/compact-history.sh) được deploy sang đây từ repo nguồn (nằm trong
# webclientFamily.client/public/). Sửa thì sửa BÊN NGUỒN — lần deploy sau sẽ ghi đè.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compact-history
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Gộp lịch sử (giữ 30 lần ghi gần nhất, chỉ khi đã quá 150 lần ghi)
        # Bấm chạy tay (workflow_dispatch) thì gộp luôn nếu quá 30 lần ghi, không chờ tới 150.
        run: bash scripts/compact-history.sh "${GITHUB_REF_NAME}" 30 "${{ github.event_name == 'workflow_dispatch' && '30' || '150' }}"
